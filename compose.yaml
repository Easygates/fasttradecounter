services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: picklane
      POSTGRES_DB: picklane
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - picklane_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U picklane -d picklane"]
      interval: 5s
      timeout: 5s
      retries: 15
    restart: unless-stopped
  migrate:
    build: .
    image: picklane-app
    command: ["npx", "drizzle-kit", "migrate"]
    environment:
      DATABASE_URL: postgresql://picklane:${POSTGRES_PASSWORD}@db:5432/picklane
    depends_on:
      db:
        condition: service_healthy
  app:
    build: .
    image: picklane-app
    env_file: .env
    environment:
      DATABASE_URL: postgresql://picklane:${POSTGRES_PASSWORD}@db:5432/picklane
      ACCESS_MODE: provisioned
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
volumes:
  picklane_data:
