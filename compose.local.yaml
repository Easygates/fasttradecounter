# LOCAL / TRUSTED-LAN ONLY — run the whole app (incl. PostgreSQL) with Docker:
#   docker compose -f compose.local.yaml up --build -d
# Or run ONLY PostgreSQL in Docker and the app with `npm run dev` on the host:
#   docker compose -f compose.local.yaml up -d db
#
# Differences from compose.yaml (production):
#   * ACCESS_MODE=trusted-network (login-free) instead of provisioned tokens.
#   * App port is reachable from your LAN so a warehouse PC/TV can open it.
#   * PostgreSQL port is exposed on 127.0.0.1 only, for host/DBeaver access.
#
# WARNING: trusted-network is NOT an internet access boundary. Keep this
# behind your router/firewall and NEVER port-forward 3000 or 5432 to the
# internet. For internet/production use compose.yaml + HTTPS (see README.md).
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: picklane
      POSTGRES_DB: picklane
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - picklane_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U picklane -d picklane"]
      interval: 5s
      timeout: 5s
      retries: 15
    restart: unless-stopped
  migrate:
    build: .
    image: picklane-app
    command: ["npx", "drizzle-kit", "migrate"]
    environment:
      DATABASE_URL: postgresql://picklane:${POSTGRES_PASSWORD}@db:5432/picklane
    depends_on:
      db:
        condition: service_healthy
  app:
    build: .
    image: picklane-app
    env_file: .env
    environment:
      DATABASE_URL: postgresql://picklane:${POSTGRES_PASSWORD}@db:5432/picklane
      ACCESS_MODE: trusted-network
      COUNTER_ACCESS_TOKEN: ""
      WAREHOUSE_ACCESS_TOKEN: ""
    ports:
      - "3000:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
volumes:
  picklane_data:
